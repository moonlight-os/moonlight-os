name: host-utils

# The host PC half of USB passthrough.  Cheap to build, so it runs on every
# push that touches it -- the ISO workflow is the expensive one.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'host-utils/**'
      - '.github/workflows/host-utils.yml'
  pull_request:
    paths:
      - 'host-utils/**'
      - '.github/workflows/host-utils.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: host-utils

env:
  # Matches GO_IMAGE in build.sh, so CI and the ISO build use one toolchain.
  GO_VERSION: '1.24'

permissions:
  contents: write   # needed only when attaching tag builds to a release

jobs:
  test:
    # Windows too: there is a platform_windows.go, and it is never exercised
    # by a linux-only vet.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Stdlib only -- there is no go.sum to key a module cache on.
          cache: false

      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...

      # -race needs cgo and a C toolchain, which only the linux runner is
      # guaranteed to have.
      - run: go test -race ./...
        if: matrix.os == 'ubuntu-latest'
      - run: go test ./...
        if: matrix.os != 'ubuntu-latest'

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Stdlib only -- there is no go.sum to key a module cache on.
          cache: false

      # build.sh already cross-compiles every target we ship; keeping the
      # target list in one place means CI cannot drift from a local build.
      - name: Build all targets
        run: VERSION="$(date +%Y.%m.%d)-${GITHUB_SHA::7}" ./build.sh

      - name: Checksums
        run: |
          cd dist
          sha256sum moonlight-os-host-utils-* > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: moonlight-os-host-utils
          path: host-utils/dist/
          retention-days: 30
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --generate-notes --title "$tag"
          gh release upload "$tag" \
            dist/moonlight-os-host-utils-* dist/SHA256SUMS --clobber
