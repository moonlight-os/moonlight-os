name: host-utils

# The host PC half of USB passthrough.  Cheap to build, so it runs on every
# push that touches it -- the ISO workflow is the expensive one.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'host-utils/**'
      - 'packaging/winget/**'
      - '.github/workflows/host-utils.yml'
  pull_request:
    paths:
      - 'host-utils/**'
      - 'packaging/winget/**'
      - '.github/workflows/host-utils.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: host-utils

env:
  # Matches GO_IMAGE in build.sh, so CI and the ISO build use one toolchain.
  GO_VERSION: '1.24'

permissions:
  contents: write   # needed only when attaching tag builds to a release

jobs:
  test:
    # Windows too: there is a platform_windows.go, and it is never exercised
    # by a linux-only vet.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Stdlib only -- there is no go.sum to key a module cache on.
          cache: false

      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...

      # -race needs cgo and a C toolchain, which only the linux runner is
      # guaranteed to have.
      - run: go test -race ./...
        if: matrix.os == 'ubuntu-latest'
      - run: go test ./...
        if: matrix.os != 'ubuntu-latest'

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # Stdlib only -- there is no go.sum to key a module cache on.
          cache: false

      # build.sh already cross-compiles every target we ship; keeping the
      # target list in one place means CI cannot drift from a local build.
      #
      # A tag build takes its version from the tag, so that what the binary
      # prints, what the release is called and what winget publishes are all
      # the same string.  Everything else gets a dated snapshot version.
      - name: Build all targets
        run: |
          case "${GITHUB_REF}" in
            refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;;
            *)            version="$(date +%Y.%m.%d)-${GITHUB_SHA::7}" ;;
          esac
          VERSION="$version" ./build.sh

      - name: Checksums
        run: |
          cd dist
          sha256sum mlos-host-utils-* > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: mlos-host-utils
          path: host-utils/dist/
          retention-days: 30
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --generate-notes --title "$tag"
          gh release upload "$tag" \
            dist/mlos-host-utils-* dist/SHA256SUMS --clobber

  # Publishing to winget is a pull request against microsoft/winget-pkgs,
  # which is why it needs a personal access token rather than github.token:
  # the fork the PR comes from lives in the maintainer's account.  Without
  # the secret the job renders the manifests, checks them, and stops there --
  # a release still happens, it just does not reach winget.
  winget:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: .
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # The hashes have to be of the files that were actually released, so
      # they come from the same artifact the release was uploaded from
      # rather than from a second build of the same commit.
      - uses: actions/download-artifact@v4
        with:
          name: mlos-host-utils
          path: dist

      - name: Render the manifests
        run: packaging/winget/render.sh "${GITHUB_REF_NAME}" dist manifests

      - uses: actions/upload-artifact@v4
        with:
          name: winget-manifests
          path: manifests/
          if-no-files-found: error

      - name: Validate
        run: |
          curl -sSL -o wingetcreate.exe https://aka.ms/wingetcreate/latest
          version="${GITHUB_REF_NAME#v}"
          ./wingetcreate.exe show \
            --manifest "manifests/m/MopigamesYT/MlosHostUtils/$version" \
            || true

      - name: Submit to microsoft/winget-pkgs
        if: env.WINGET_TOKEN != ''
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./wingetcreate.exe submit \
            --token "$WINGET_TOKEN" \
            "manifests/m/MopigamesYT/MlosHostUtils/$version"

      - name: No token, no submission
        if: env.WINGET_TOKEN == ''
        run: |
          echo "WINGET_TOKEN is not set, so nothing was submitted to winget." >> "$GITHUB_STEP_SUMMARY"
          echo "The rendered manifests are attached to this run as winget-manifests." >> "$GITHUB_STEP_SUMMARY"
