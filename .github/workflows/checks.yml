name: source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appliance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shell checker
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - name: Privileged-helper regression tests
        run: |
          for test in tools/test-helper-*.py; do
            python3 "$test"
          done
          python3 tools/test-updater-contract.py
          python3 tools/test-updater-channel.py
          python3 tools/test-updater-kernel-handoff.py
          python3 tools/test-update-manifest.py
          python3 tools/test-version-branding.py
          python3 tools/test-session-contract.py
      - name: Python syntax
        run: |
          python3 -m py_compile \
            config/includes.chroot/usr/local/bin/moonlight-helper \
            config/includes.chroot/usr/local/sbin/moonlight-config-set
      - name: Changed workflow shell syntax
        run: |
          shellcheck -S error \
            config/includes.chroot/usr/local/bin/moonlight-common \
            config/includes.chroot/usr/local/bin/moonlight-backup \
            config/includes.chroot/usr/local/bin/moonlight-install \
            config/includes.chroot/usr/local/bin/moonlight-menu \
            config/includes.chroot/usr/local/bin/moonlight-panel \
            config/includes.chroot/usr/local/bin/moonlight-session \
            config/includes.chroot/usr/local/bin/moonlight-input \
            config/includes.chroot/usr/local/bin/moonlight-wlsession \
            config/includes.chroot/usr/local/bin/moonlight-welcome \
            config/includes.chroot/usr/local/sbin/moonlight-update \
            config/includes.chroot/usr/local/sbin/moonlight-slot-sync \
            config/includes.chroot/etc/grub.d/09_moonlight_slots \
            config/includes.chroot/etc/initramfs/post-update.d/zz-moonlight-kernel-handoff \
            config/hooks/normal/0050-moonlight-updater.hook.chroot \
            config/hooks/normal/9100-moonlight-initramfs.hook.chroot \
            tools/format-iso-version.sh \
            tools/render-update-manifest.sh \
            config/includes.chroot/usr/local/lib/moonlight-os/telemetry
      - name: Sudo policy has no unrestricted rule
        run: |
          ! grep -Eq "NOPASSWD:[[:space:]]*(ALL|/bin/(ba)?sh)" config/includes.chroot/etc/sudoers.d/moonlight
          sudo visudo -cf config/includes.chroot/etc/sudoers.d/moonlight
