# The settings panel, opened from the keyboard.
#
# This is read straight off /dev/input, which is the whole point: while a
# stream is running Moonlight grabs the X keyboard, so the window manager
# never sees a key combination.  The kernel still does.
#
# Format is <key>+<modifier>... <value> <command>, trigger key FIRST -- the
# other order does not parse.  Value 1 is "pressed".
# No blank lines below either: thd logs "Unable to parse trigger line"
# for each one.  A bare "#" is fine.
#
# Two physical keys are listed because these codes are positional, not
# lettered: the key labelled M sits where a US keyboard has M on QWERTY, and
# where it has the semicolon on AZERTY.  Both spellings of the modifiers are
# covered so it does not matter which Ctrl or Alt is used.
#
# The host PC receives this combination too -- unavoidable, and harmless.
#
KEY_M+KEY_LEFTCTRL+KEY_LEFTALT           1   /usr/local/bin/moonlight-panel-hotkey
KEY_M+KEY_RIGHTCTRL+KEY_LEFTALT          1   /usr/local/bin/moonlight-panel-hotkey
KEY_M+KEY_LEFTCTRL+KEY_RIGHTALT          1   /usr/local/bin/moonlight-panel-hotkey
KEY_SEMICOLON+KEY_LEFTCTRL+KEY_LEFTALT   1   /usr/local/bin/moonlight-panel-hotkey
KEY_SEMICOLON+KEY_RIGHTCTRL+KEY_LEFTALT  1   /usr/local/bin/moonlight-panel-hotkey
