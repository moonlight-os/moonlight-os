# Debian's unit drops to "nobody" after opening the input devices, which
# leaves the trigger command unable to become the session user or reach the
# display.  On a single-user appliance whose console already autologs in with
# passwordless sudo, that buys nothing.
#
# The other half of making this work is masking triggerhappy.socket, which
# 0020-moonlight-services.hook.chroot does.  Without that, Ctrl+Alt+M works
# on a laptop and not on a machine with a USB keyboard -- see the hook for
# the reason, which is not obvious and took a tablet to find.
[Service]
ExecStart=
ExecStart=/usr/sbin/thd --triggers /etc/triggerhappy/triggers.d/ --socket /run/thd.socket --user root --deviceglob /dev/input/event*
